[project]
name = "grafana-cloud-migrate"
version = "0.1.0"
description = "Migrate a self-hosted Grafana to Grafana Cloud through the HTTP API"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "typer>=0.15", "rich>=13.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
