name: grafana-cloud-migrate

on:
  pull_request:
    paths:
      - "grafana-cloud-migrate/**"
      - ".github/workflows/grafana-cloud-migrate.yml"
  push:
    branches:
      - main
    paths:
      - "grafana-cloud-migrate/**"
      - ".github/workflows/grafana-cloud-migrate.yml"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grafana-cloud-migrate
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # --frozen fails on a lockfile that drifted from pyproject.toml instead of rewriting it.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
